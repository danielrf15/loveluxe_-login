<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Luxe - Customer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="customer-page">

        <div class="customer-header">

            <div class="customer-brand">
                <h1>LOVE LUXE</h1>
                <p>BY EA • EST. 2024</p>
            </div>

            <button class="logout-button" onclick="logout()">
                LOG OUT
            </button>

        </div>

        <div class="customer-content">

            <div class="customer-card">

                <p class="small-title">CUSTOMER ACCOUNT</p>

                <h2 id="welcomeCustomer">
                    Welcome!
                </h2>

                <p>
                    Welcome to Love Luxe. You can browse our products,
                    place orders and manage your customer account.
                </p>

                <div class="customer-actions">

                    <div class="action-card">
                        <h3>Products</h3>
                        <p>Browse our available products.</p>
                        <button>VIEW PRODUCTS</button>
                    </div>

                    <div class="action-card">
                        <h3>My Orders</h3>
                        <p>View your orders and transactions.</p>
                        <button>MY ORDERS</button>
                    </div>

                    <div class="action-card">
                        <h3>Appointments</h3>
                        <p>Book and manage your appointments.</p>
                        <button>APPOINTMENTS</button>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
