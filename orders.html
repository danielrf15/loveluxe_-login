<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - My Orders
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <style>

        /* ==========================================
           ACCOUNT PAGE
        ========================================== */

        .account-page-content {
            padding: 35px 40px 50px;
        }


        .account-page-header {
            margin-bottom: 28px;
        }


        .account-page-eyebrow {
            color: #c5a059;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }


        .account-page-header h2 {
            font-family: Georgia, serif;
            font-size: 30px;
            margin-bottom: 8px;
        }


        .account-page-header p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }


        .account-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px;
        }


        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }


        .order-item {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            background: #ffffff;
        }


        .order-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eeeeee;
        }


        .order-number {
            font-weight: 700;
            font-size: 13px;
        }


        .order-date {
            color: #888;
            font-size: 12px;
            margin-left: 10px;
        }


        .order-status {
            background: #f5f0e7;
            color: #9a783d;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }


        .order-item-content {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 0;
        }


        .order-item-content strong {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }


        .order-item-content span {
            color: #777;
            font-size: 12px;
        }


        .order-total {
            white-space: nowrap;
        }


        .order-item-footer {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #777;
            font-size: 11px;
            padding-top: 14px;
            border-top: 1px solid #eeeeee;
        }


        .empty-orders {
            text-align: center;
            padding: 55px 20px;
        }


        .empty-orders-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }


        .empty-orders h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }


        .empty-orders p {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }


        .primary-button-link {
            display: inline-block;
            background: #111111;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
        }


        .primary-button-link:hover {
            background: #c5a059;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .account-page-content {
                padding: 25px 18px 40px;
            }


            .account-card {
                padding: 18px;
            }


            .order-item-top,
            .order-item-content,
            .order-item-footer {
                flex-direction: column;
                align-items: flex-start;
            }


            .order-total {
                margin-top: 5px;
            }

        }

    </style>

</head>


<body>


    <!-- MOBILE HEADER -->

    <header class="mobile-header">

        <button
            class="menu-button"
            onclick="openSidebar()"
            type="button"
        >
            ☰
        </button>


        <div class="mobile-brand">

            LOVE LUXE

            <span>
                by EA
            </span>

        </div>

    </header>



    <!-- ==========================================
         SAME SIDEBAR AS CATALOG
    =========================================== -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>



        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <!-- PRODUCTS -->

            <a
                href="catalog.html"
                class="sidebar-link"
                id="productsLink"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>



            <!-- MY ACCOUNT -->

            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span class="account-arrow">
                    ▲
                </span>

            </button>



            <!-- ACCOUNT DROPDOWN -->

            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a href="personal.html">
                    Personal Information
                </a>

                <a
                    href="orders.html"
                    class="active"
                >
                    My Orders
                </a>

                <a href="settings.html">
                    Settings
                </a>

            </div>

        </div>

    </aside>



    <!-- OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="shop-main">


        <!-- TOP BAR -->

        <div class="shop-topbar">

            <div>

                <div class="page-small-title">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    My Orders
                </h1>

            </div>


            <div class="customer-profile">

                <div class="customer-avatar">
                    C
                </div>

                <div>

                    <div class="customer-label">
                        Welcome Customer
                    </div>

                    <div
                        class="customer-name"
                        id="customerName"
                    >
                        Customer
                    </div>

                </div>

            </div>

        </div>



        <!-- ACCOUNT CONTENT -->

        <section class="account-page-content">


            <div class="account-page-header">

                <div class="account-page-eyebrow">
                    ORDERS
                </div>

                <h2>
                    My Orders
                </h2>

                <p>
                    View your recent Love Luxe orders.
                </p>

            </div>



            <div class="account-card">

                <div
                    id="ordersList"
                    class="orders-list"
                ></div>

            </div>

        </section>

    </main>



    <script src="data.js"></script>


    <script>

        /* ==========================================
           ACCOUNT DROPDOWN
        ========================================== */

        const accountToggle =
            document.getElementById("accountToggle");

        const accountDropdown =
            document.getElementById("accountDropdown");


        accountToggle.addEventListener(
            "click",
            function () {

                accountDropdown.classList.toggle("show");

                accountToggle.classList.toggle("active");


                const arrow =
                    accountToggle.querySelector(
                        ".account-arrow"
                    );


                if (
                    accountDropdown.classList.contains("show")
                ) {

                    arrow.textContent = "▲";

                } else {

                    arrow.textContent = "▼";

                }

            }
        );



        /* ==========================================
           MOBILE SIDEBAR
        ========================================== */

        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");

            document
                .getElementById("sidebarOverlay")
                .classList.add("active");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");

            document
                .getElementById("sidebarOverlay")
                .classList.remove("active");

        }


        document
            .getElementById("sidebarOverlay")
            .addEventListener(
                "click",
                closeSidebar
            );



        /* ==========================================
           CUSTOMER
        ========================================== */

        const customer =
            customers.find(
                function (user) {

                    return user.role === "customer";

                }
            );


        if (!customer) {

            window.location.href = "index.html";

        } else {

            document.getElementById(
                "customerName"
            ).textContent =
                customer.fullName || "Customer";

        }



        /* ==========================================
           LOAD ORDERS
        ========================================== */

        const ordersList =
            document.getElementById("ordersList");


        const customerOrders =
            orders.filter(
                function (order) {

                    return (
                        order.customerUsername ===
                        customer.username
                    );

                }
            );


        if (customerOrders.length === 0) {

            ordersList.innerHTML = `

                <div class="empty-orders">

                    <div class="empty-orders-icon">
                        🛍
                    </div>

                    <h3>
                        No Orders Yet
                    </h3>

                    <p>
                        Your orders will appear here after you make a purchase.
                    </p>

                    <a
                        href="catalog.html"
                        class="primary-button-link"
                    >
                        SHOP NOW
                    </a>

                </div>

            `;

        } else {

            ordersList.innerHTML =
                customerOrders
                    .slice()
                    .reverse()
                    .map(
                        function (order) {

                            return `

                                <div class="order-item">

                                    <div class="order-item-top">

                                        <div>

                                            <span class="order-number">
                                                ${order.orderNumber || "Order"}
                                            </span>

                                            <span class="order-date">
                                                ${order.date || ""}
                                            </span>

                                        </div>

                                        <span class="order-status">
                                            ${order.status || "Pending"}
                                        </span>

                                    </div>


                                    <div class="order-item-content">

                                        <div>

                                            <strong>
                                                ${order.productName || "Product"}
                                            </strong>

                                            <span>
                                                ${order.category || ""}
                                                •
                                                Quantity:
                                                ${order.quantity || 1}
                                            </span>

                                        </div>


                                        <strong class="order-total">
                                            ₱${Number(
                                                order.total || 0
                                            ).toLocaleString(
                                                "en-PH",
                                                {
                                                    minimumFractionDigits: 2
                                                }
                                            )}
                                        </strong>

                                    </div>


                                    <div class="order-item-footer">

                                        <span>
                                            ${order.paymentMethod || ""}
                                        </span>

                                        <span>
                                            ${order.shippingAddress || ""}
                                        </span>

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }

    </script>


</body>

</html>
