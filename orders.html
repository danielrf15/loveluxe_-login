<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - My Orders
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         MOBILE HEADER
    =========================================== -->

    <header class="mobile-header">

        <button
            class="menu-button"
            type="button"
            onclick="openSidebar()"
        >
            ☰
        </button>

        <div class="mobile-brand">

            LOVE LUXE

            <span>
                by EA
            </span>

        </div>

    </header>


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <a
                href="catalog.html"
                class="sidebar-link"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>


            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span class="account-arrow">
                    ▲
                </span>

            </button>


            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a
                    href="personal.html"
                >
                    Personal Information
                </a>

                <a
                    href="orders.html"
                    class="active"
                >
                    My Orders
                </a>

                <a
                    href="settings.html"
                >
                    Settings
                </a>

            </div>

        </div>

    </aside>


    <!-- ==========================================
         SIDEBAR OVERLAY
    =========================================== -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="customer-main">


        <header class="customer-topbar">

            <div>

                <div class="customer-topbar-label">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    My Orders
                </h1>

            </div>

        </header>


        <!-- ORDERS -->

        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        ORDERS
                    </div>

                    <h2>
                        My Orders
                    </h2>

                    <p>
                        View your recent Love Luxe orders.
                    </p>

                </div>

            </div>


            <div
                class="account-card"
                id="ordersList"
            ></div>

        </section>


    </main>


    <!-- ==========================================
         DATA
    =========================================== -->

    <script src="data.js"></script>


    <script>

        const data = window.LoveLuxeData;

        const user = data.customers[0];


        /* ==========================================
           PAGE LOAD
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadOrders();

                setupSidebar();

            }
        );


        /* ==========================================
           LOAD ORDERS
        ========================================== */

        function loadOrders() {

            const list =
                document.getElementById(
                    "ordersList"
                );


            const customerOrders =
                data.orders
                    .filter(
                        function (order) {

                            return (
                                order.customerUsername ===
                                user.username
                            );

                        }
                    )
                    .slice()
                    .reverse();


            if (customerOrders.length === 0) {

                list.innerHTML = `

                    <div class="empty-orders">

                        <div class="empty-orders-icon">
                            🛍
                        </div>

                        <h3>
                            No Orders Yet
                        </h3>

                        <p>
                            Your orders will appear here after you make a purchase.
                        </p>

                        <a
                            href="catalog.html"
                            class="primary-button-link"
                        >
                            SHOP NOW
                        </a>

                    </div>

                `;

                return;

            }


            list.innerHTML =
                customerOrders
                    .map(
                        function (order) {

                            return `

                                <div class="order-item">

                                    <div class="order-item-top">

                                        <div>

                                            <span class="order-number">
                                                ${order.orderNumber}
                                            </span>

                                            <span class="order-date">
                                                ${new Date(
                                                    order.date
                                                ).toLocaleDateString(
                                                    "en-PH"
                                                )}
                                            </span>

                                        </div>

                                        <span class="order-status">
                                            ${order.status}
                                        </span>

                                    </div>


                                    <div class="order-item-content">

                                        <div>

                                            <strong>
                                                ${order.productName}
                                            </strong>

                                            <span>
                                                Category:
                                                ${order.category}
                                            </span>

                                            <span>
                                                Quantity:
                                                ${order.quantity}
                                            </span>

                                            ${
                                                order.color
                                                    ? `
                                                        <span>
                                                            Color:
                                                            ${order.color}
                                                        </span>
                                                    `
                                                    : ""
                                            }

                                            ${
                                                order.size
                                                    ? `
                                                        <span>
                                                            Size:
                                                            ${order.size}
                                                        </span>
                                                    `
                                                    : ""
                                            }

                                            ${
                                                order.scent
                                                    ? `
                                                        <span>
                                                            Scent:
                                                            ${order.scent}
                                                        </span>
                                                    `
                                                    : ""
                                            }

                                        </div>


                                        <strong class="order-total">

                                            ₱${Number(
                                                order.total
                                            ).toLocaleString(
                                                "en-PH",
                                                {
                                                    minimumFractionDigits: 2
                                                }
                                            )}

                                        </strong>

                                    </div>


                                    <div class="order-item-footer">

                                        <span>
                                            ${order.paymentMethod}
                                        </span>

                                        <span>
                                            ${
                                                order.shippingAddress ||
                                                "No address"
                                            }
                                        </span>

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }


        /* ==========================================
           SIDEBAR
        ========================================== */

        function setupSidebar() {

            const toggle =
                document.getElementById(
                    "accountToggle"
                );


            const dropdown =
                document.getElementById(
                    "accountDropdown"
                );


            toggle.onclick =
                function () {

                    dropdown.classList.toggle("show");

                    toggle.classList.toggle("active");

                };


            document
                .getElementById("sidebarOverlay")
                .onclick = closeSidebar;

        }


        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");


            document
                .getElementById("sidebarOverlay")
                .classList.add("active");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");


            document
                .getElementById("sidebarOverlay")
                .classList.remove("active");

        }

    </script>


</body>

</html>
