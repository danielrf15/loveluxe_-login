<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - My Orders
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body id="customerPage">


    <header class="customer-mobile-header">

        <button
            type="button"
            id="customerMenuButton"
            class="customer-menu-button"
        >
            ☰
        </button>


        <div class="customer-mobile-brand">

            LOVE LUXE

            <span>
                BY EA • EST. 2024
            </span>

        </div>

    </header>



    <aside
        id="customerSidebar"
        class="customer-sidebar"
    >

        <div class="customer-brand">

            <div class="customer-brand-title">
                LOVE LUXE
            </div>

            <div class="customer-brand-subtitle">
                BY EA • EST. 2024
            </div>

        </div>


        <div class="customer-sidebar-welcome">

            <span>
                Welcome
            </span>

            <strong id="sidebarCustomerName">
                Customer
            </strong>

        </div>


        <nav class="customer-nav">

            <div class="customer-nav-heading">
                ACCOUNT
            </div>


            <a
                href="personal.html"
                class="customer-nav-link"
            >
                <span>
                    Personal Information
                </span>
            </a>


            <a
                href="orders.html"
                class="customer-nav-link active"
            >
                <span>
                    My Orders
                </span>
            </a>


            <a
                href="settings.html"
                class="customer-nav-link"
            >
                <span>
                    Settings
                </span>
            </a>


            <a
                href="catalog.html"
                class="customer-nav-link"
            >
                <span>
                    Back to Shop
                </span>
            </a>

        </nav>


        <div class="customer-sidebar-bottom">

            <button
                type="button"
                id="logoutButton"
                class="customer-logout-button"
            >
                ↪ &nbsp; Logout
            </button>

        </div>

    </aside>



    <div
        id="customerSidebarOverlay"
        class="customer-sidebar-overlay"
    ></div>



    <main class="customer-main">


        <header class="customer-topbar">

            <div>

                <div class="customer-topbar-label">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    My Orders
                </h1>

            </div>


            <a
                href="catalog.html"
                class="shop-button"
            >
                Back to Shop
            </a>

        </header>



        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        ORDERS
                    </div>

                    <h2>
                        My Orders
                    </h2>

                    <p>
                        View your recent Love Luxe orders.
                    </p>

                </div>

            </div>



            <div
                class="account-card"
                id="ordersList"
            >

            </div>

        </section>

    </main>



    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const user =
                    JSON.parse(
                        localStorage.getItem(
                            "loveLuxeCurrentUser"
                        )
                    );


                if (
                    !user ||
                    user.role !== "customer"
                ) {

                    window.location.href =
                        "index.html";

                    return;

                }


                document.getElementById(
                    "sidebarCustomerName"
                ).textContent =
                    user.fullName ||
                    "Customer";


                loadOrders();


                document.getElementById(
                    "logoutButton"
                ).addEventListener(
                    "click",
                    logout
                );


                setupMobileMenu();

            }
        );


        function loadOrders() {

            const user =
                JSON.parse(
                    localStorage.getItem(
                        "loveLuxeCurrentUser"
                    )
                );


            const allOrders =
                JSON.parse(
                    localStorage.getItem(
                        "loveLuxeOrders"
                    )
                ) || [];


            const orders =
                allOrders.filter(
                    function (order) {

                        return order.customerUsername ===
                            user.username;

                    }
                ).reverse();


            const ordersList =
                document.getElementById(
                    "ordersList"
                );


            if (!ordersList) {
                return;
            }


            if (orders.length === 0) {

                ordersList.innerHTML = `

                    <div class="empty-orders">

                        <div class="empty-orders-icon">
                            🛍
                        </div>

                        <h3>
                            No Orders Yet
                        </h3>

                        <p>
                            Your orders will appear here after you make a purchase.
                        </p>

                        <a
                            href="catalog.html"
                            class="primary-button-link"
                        >
                            SHOP NOW
                        </a>

                    </div>

                `;

                return;

            }


            ordersList.innerHTML =
                orders.map(
                    function (order) {

                        const date =
                            new Date(
                                order.date
                            );


                        const formattedDate =
                            date.toLocaleDateString(
                                "en-PH",
                                {
                                    year: "numeric",
                                    month: "long",
                                    day: "numeric"
                                }
                            );


                        return `

                            <div
                                class="order-card"
                                style="
                                    border: 1px solid #e5e5e5;
                                    border-radius: 10px;
                                    padding: 20px;
                                    margin-bottom: 15px;
                                "
                            >

                                <div
                                    style="
                                        display:flex;
                                        justify-content:space-between;
                                        gap:15px;
                                        flex-wrap:wrap;
                                    "
                                >

                                    <div>

                                        <div
                                            style="
                                                color:#c5a059;
                                                font-size:11px;
                                                letter-spacing:1px;
                                                font-weight:bold;
                                            "
                                        >
                                            ORDER
                                        </div>

                                        <h3
                                            style="
                                                margin-top:5px;
                                            "
                                        >
                                            ${order.orderNumber}
                                        </h3>

                                    </div>


                                    <strong>
                                        ${order.status}
                                    </strong>

                                </div>


                                <div
                                    style="
                                        margin-top:15px;
                                        line-height:1.8;
                                        color:#555;
                                        font-size:14px;
                                    "
                                >

                                    <div>
                                        <strong>Product:</strong>
                                        ${order.productName}
                                    </div>


                                    <div>
                                        <strong>Category:</strong>
                                        ${order.category}
                                    </div>


                                    <div>
                                        <strong>Quantity:</strong>
                                        ${order.quantity}
                                    </div>


                                    ${
                                        order.color
                                            ? `
                                                <div>
                                                    <strong>Color:</strong>
                                                    ${order.color}
                                                </div>
                                            `
                                            : ""
                                    }


                                    ${
                                        order.size
                                            ? `
                                                <div>
                                                    <strong>Size:</strong>
                                                    ${order.size}
                                                </div>
                                            `
                                            : ""
                                    }


                                    ${
                                        order.scent
                                            ? `
                                                <div>
                                                    <strong>Scent:</strong>
                                                    ${order.scent}
                                                </div>
                                            `
                                            : ""
                                    }


                                    <div>
                                        <strong>Payment:</strong>
                                        ${order.paymentMethod}
                                    </div>


                                    <div>
                                        <strong>Date:</strong>
                                        ${formattedDate}
                                    </div>

                                </div>


                                <div
                                    style="
                                        border-top:1px solid #eeeeee;
                                        margin-top:15px;
                                        padding-top:15px;
                                        display:flex;
                                        justify-content:space-between;
                                        align-items:center;
                                    "
                                >

                                    <span>
                                        Total
                                    </span>

                                    <strong
                                        style="
                                            font-size:18px;
                                        "
                                    >
                                        ₱${Number(
                                            order.total
                                        ).toLocaleString(
                                            "en-PH",
                                            {
                                                minimumFractionDigits: 2,
                                                maximumFractionDigits: 2
                                            }
                                        )}
                                    </strong>

                                </div>

                            </div>

                        `;

                    }
                ).join("");

        }


        function setupMobileMenu() {

            const menuButton =
                document.getElementById(
                    "customerMenuButton"
                );


            const sidebar =
                document.getElementById(
                    "customerSidebar"
                );


            const overlay =
                document.getElementById(
                    "customerSidebarOverlay"
                );


            if (menuButton) {

                menuButton.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.toggle(
                            "open"
                        );

                        overlay.classList.toggle(
                            "active"
                        );

                    }
                );

            }


            if (overlay) {

                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove(
                            "open"
                        );

                        overlay.classList.remove(
                            "active"
                        );

                    }
                );

            }

        }


        function logout() {

            const confirmLogout =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (!confirmLogout) {
                return;
            }


            localStorage.removeItem(
                "loveLuxeCurrentUser"
            );


            localStorage.removeItem(
                "loveLuxeAdminLoggedIn"
            );


            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
