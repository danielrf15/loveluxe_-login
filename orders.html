<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - My Orders
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <style>

        .account-content {
            padding: 30px;
            max-width: 1100px;
        }

        .account-page-header {
            margin-bottom: 25px;
        }

        .account-page-header .small-title {
            color: #c5a059;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .account-page-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .account-page-header p {
            color: #777;
            font-size: 14px;
        }

        .account-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-orders-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-orders h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-orders p {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .shop-now-button {
            display: inline-block;
            background: #c5a059;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        .shop-now-button:hover {
            background: #ad8845;
        }

        .order-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .order-card h3 {
            margin-bottom: 8px;
        }

        .order-card p {
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 15px;
            border-top: 1px solid #292929;
        }

        .logout-link {
            margin-bottom: 0;
            color: #bdbdbd;
        }

        .logout-link:hover {
            color: white;
            background: #1d1d1d;
        }

        .account-dropdown a.active {
            background: #c5a059;
            color: white;
        }

        .account-dropdown a.active:hover {
            background: #c5a059;
            color: white;
        }

        @media (max-width: 700px) {

            .account-content {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- MOBILE HEADER -->

    <header class="mobile-header">

        <button
            class="menu-button"
            id="menuButton"
            type="button"
        >
            ☰
        </button>

        <div class="mobile-brand">
            LOVE LUXE
            <span>by EA</span>
        </div>

    </header>



    <!-- SIDEBAR -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <a
                href="catalog.html"
                class="sidebar-link"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>


            <!-- MY ACCOUNT -->

            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span
                    class="account-arrow"
                    id="accountArrow"
                >
                    ▲
                </span>

            </button>


            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a href="personal.html">
                    Personal Information
                </a>

                <a
                    href="orders.html"
                    class="active"
                >
                    My Orders
                </a>

                <a href="settings.html">
                    Settings
                </a>

            </div>

        </div>


        <!-- LOGOUT -->

        <div class="sidebar-bottom">

            <button
                type="button"
                class="sidebar-link logout-link"
                id="logoutButton"
            >

                <span>
                    🚪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>



    <!-- OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- MAIN -->

    <main class="shop-main">


        <!-- TOP BAR -->

        <div class="shop-topbar">

            <div>

                <div class="page-small-title">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    My Orders
                </h1>

            </div>


            <div class="customer-profile">

                <div
                    class="customer-avatar"
                    id="customerAvatar"
                >
                    C
                </div>

                <div>

                    <div class="customer-label">
                        Welcome Customer
                    </div>

                    <div
                        class="customer-name"
                        id="customerName"
                    >
                        Customer
                    </div>

                </div>

            </div>

        </div>



        <!-- CONTENT -->

        <section class="account-content">

            <div class="account-page-header">

                <div class="small-title">
                    ORDERS
                </div>

                <h2>
                    My Orders
                </h2>

                <p>
                    View your recent Love Luxe orders.
                </p>

            </div>


            <div
                class="account-card"
                id="ordersContainer"
            >

            </div>

        </section>


    </main>



    <script src="data.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =========================
                   ACCOUNT DROPDOWN
                ========================= */

                const accountToggle =
                    document.getElementById(
                        "accountToggle"
                    );

                const accountDropdown =
                    document.getElementById(
                        "accountDropdown"
                    );

                const accountArrow =
                    document.getElementById(
                        "accountArrow"
                    );


                accountToggle.addEventListener(
                    "click",
                    function () {

                        accountDropdown.classList.toggle(
                            "show"
                        );

                        accountToggle.classList.add(
                            "active"
                        );

                        if (
                            accountDropdown.classList.contains(
                                "show"
                            )
                        ) {

                            accountArrow.textContent = "▲";

                        } else {

                            accountArrow.textContent = "▼";

                        }

                    }
                );


                /* =========================
                   MOBILE SIDEBAR
                ========================= */

                const sidebar =
                    document.getElementById(
                        "shopSidebar"
                    );

                const overlay =
                    document.getElementById(
                        "sidebarOverlay"
                    );

                const menuButton =
                    document.getElementById(
                        "menuButton"
                    );


                menuButton.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.add(
                            "open"
                        );

                        overlay.classList.add(
                            "show"
                        );

                    }
                );


                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove(
                            "open"
                        );

                        overlay.classList.remove(
                            "show"
                        );

                    }
                );


                /* =========================
                   CUSTOMER INFORMATION
                ========================= */

                if (
                    typeof currentUser !== "undefined" &&
                    currentUser !== null &&
                    currentUser.role === "customer"
                ) {

                    document.getElementById(
                        "customerName"
                    ).textContent =
                        currentUser.fullName ||
                        "Customer";

                    document.getElementById(
                        "customerAvatar"
                    ).textContent =
                        (
                            currentUser.fullName ||
                            "C"
                        ).charAt(0).toUpperCase();

                }


                /* =========================
                   ORDERS
                ========================= */

                const ordersContainer =
                    document.getElementById(
                        "ordersContainer"
                    );


                if (
                    typeof orders === "undefined" ||
                    orders.length === 0
                ) {

                    ordersContainer.innerHTML = `

                        <div class="empty-orders">

                            <div class="empty-orders-icon">
                                🛍️
                            </div>

                            <h3>
                                No Orders Yet
                            </h3>

                            <p>
                                Your orders will appear here after you make a purchase.
                            </p>

                            <a
                                href="catalog.html"
                                class="shop-now-button"
                            >
                                SHOP NOW
                            </a>

                        </div>

                    `;

                } else {

                    ordersContainer.innerHTML = "";

                    orders.forEach(
                        function (order) {

                            const orderCard =
                                document.createElement(
                                    "div"
                                );

                            orderCard.className =
                                "order-card";

                            orderCard.innerHTML = `

                                <h3>
                                    Order #${order.id || "N/A"}
                                </h3>

                                <p>
                                    Product: ${order.productName || "Product"}
                                </p>

                                <p>
                                    Quantity: ${order.quantity || 1}
                                </p>

                                <p>
                                    Total: ₱${Number(
                                        order.total || 0
                                    ).toLocaleString(
                                        "en-PH",
                                        {
                                            minimumFractionDigits: 2
                                        }
                                    )}
                                </p>

                            `;

                            ordersContainer.appendChild(
                                orderCard
                            );

                        }
                    );

                }


                /* =========================
                   LOGOUT
                ========================= */

                document.getElementById(
                    "logoutButton"
                ).addEventListener(
                    "click",
                    function () {

                        const confirmLogout =
                            confirm(
                                "Are you sure you want to logout?"
                            );

                        if (!confirmLogout) {
                            return;
                        }

                        if (
                            typeof currentUser !== "undefined"
                        ) {

                            currentUser = null;

                        }

                        window.location.href =
                            "index.html";

                    }
                );

            }
        );

    </script>

</body>

</html>
