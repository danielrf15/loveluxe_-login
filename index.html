<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- BRAND -->
        <div class="brand">
            <h1>LOVE LUXE</h1>
            <p>BY EA • EST. 2024</p>
        </div>


        <!-- LOGIN BOX -->
        <div class="login-box">

            <h2>Admin Login</h2>

            <p class="login-description">
                Sign in to access the Love Luxe dashboard
            </p>


            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <p id="errorMessage"></p>


                <button type="submit">
                    LOGIN
                </button>

            </form>

        </div>


        <p class="footer">
            Admin access only
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
