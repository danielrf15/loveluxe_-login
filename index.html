<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Login
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         LOGIN PAGE
    =========================================== -->

    <div class="login-container">


        <!-- ==========================================
             BRAND
        =========================================== -->

        <div class="brand">

            <div class="brand-title">
                LOVE LUXE
            </div>

            <div class="brand-subtitle">
                BY EA • EST. 2024
            </div>

        </div>



        <!-- ==========================================
             LOGIN CARD
        =========================================== -->

        <div class="login-card">


            <!-- HEADING -->

            <div class="login-heading">

                <div class="small-title">
                    WELCOME BACK
                </div>

                <h1>
                    Sign In
                </h1>

                <p>
                    Sign in to your Love Luxe account
                </p>

            </div>



            <!-- ==========================================
                 LOGIN FORM
            =========================================== -->

            <form
                id="loginForm"
                class="login-form"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="forgot-password-container">

                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>



                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>



                <!-- SIGN IN BUTTON -->

                <button
                    type="submit"
                    class="main-button"
                >
                    SIGN IN
                </button>


            </form>



            <!-- ==========================================
                 SIGN UP
            =========================================== -->

            <div class="signup-link-container">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="signup.html"
                    class="signup-link"
                >
                    Create Account
                </a>

            </div>


        </div>



        <!-- ==========================================
             FOOTER
        =========================================== -->

        <div class="login-footer">

            Love Luxe by EA • Est. 2024

        </div>


    </div>



    <!-- ==========================================
         ARRAY DATA
         
         IMPORTANT:
         data.js MUST COME BEFORE script.js
    =========================================== -->

    <script src="data.js"></script>

    <script src="script.js"></script>


</body>

</html>
