<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">

                <h1>LOVE LUXE</h1>

                <p>BY EA • EST. 2024</p>

            </div>


            <h2>Welcome Back</h2>

            <p class="subtitle">
                Sign in to continue
            </p>


            <form onsubmit="login(); return false;">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <p
                    id="loginError"
                    class="error-message">
                </p>


                <button
                    type="submit"
                    class="main-button">

                    Sign In

                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
