<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Luxe by EA - Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-brand">
                LOVE LUXE
            </div>

            <div class="auth-subtitle">
                BY EA • EST. 2024
            </div>


            <h1>Sign In</h1>

            <p class="welcome-text">
                Welcome back to Love Luxe
            </p>


            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="forgot-row">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    SIGN IN
                </button>

            </form>


            <div class="or-divider">
                <span>OR</span>
            </div>


            <div class="signup-text">
                Don't have an account?
            </div>


            <a
                href="signup.html"
                class="signup-link"
            >
                Sign Up
            </a>


            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </div>

    </div>


  <script src="script.js"></script>

</body>

</html>
