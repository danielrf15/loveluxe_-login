<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Create Account
    </title>

    <!-- MAIN LOVE LUXE STYLESHEET -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- SIGNUP PAGE STYLING -->
    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f6fa;
            font-family: "Plus Jakarta Sans", Arial, sans-serif;
            color: #111111;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }


        /* ==========================================
           SIGNUP CONTAINER
        ========================================== */

        .signup-page {
            width: 100%;
            max-width: 900px;
        }


        /* ==========================================
           BRAND
        ========================================== */

        .signup-brand {
            text-align: center;
            margin-bottom: 25px;
        }


        .signup-brand-title {
            font-family: "Cinzel", Georgia, serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            line-height: 1;
            color: #111111;
        }


        .signup-brand-subtitle {
            margin-top: 8px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #555555;
            text-transform: uppercase;
        }


        /* ==========================================
           CARD
        ========================================== */

        .signup-card {
            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 40px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.08);
        }


        .signup-heading {
            text-align: center;
            margin-bottom: 30px;
        }


        .signup-heading .small-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #c5a059;
            margin-bottom: 8px;
        }


        .signup-heading h1 {
            margin: 0;

            font-family: "Cinzel", Georgia, serif;

            font-size: 30px;

            font-weight: 600;

            color: #111111;
        }


        .signup-heading p {
            margin: 10px 0 0;

            font-size: 14px;

            color: #6b7280;
        }


        /* ==========================================
           FORM
        ========================================== */

        .signup-form {
            width: 100%;
        }


        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
        }


        .form-group.full-width {
            grid-column: 1 / -1;
        }


        .form-group label {
            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #222222;
        }


        .form-group input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #d7dce3;

            border-radius: 7px;

            background: #ffffff;

            color: #111111;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-group input:focus {
            border-color: #c5a059;

            box-shadow:
                0 0 0 3px rgba(197, 160, 89, 0.12);
        }


        .form-group input::placeholder {
            color: #9ca3af;
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        .signup-message {
            min-height: 20px;

            margin-top: 18px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;
        }


        .auth-message.error {
            color: #b42318;
        }


        .auth-message.success {
            color: #18794e;
        }


        /* ==========================================
           BUTTON
        ========================================== */

        .signup-button {
            width: 100%;

            height: 50px;

            margin-top: 20px;

            border: none;

            border-radius: 7px;

            background: #111111;

            color: #ffffff;

            font-family: inherit;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .signup-button:hover {
            background: #c5a059;

            color: #111111;
        }


        .signup-button:active {
            transform: translateY(1px);
        }


        /* ==========================================
           BACK TO LOGIN
        ========================================== */

        .back-login {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #111111;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }


        .back-login:hover {
            color: #c5a059;
        }


        /* ==========================================
           FOOTER
        ========================================== */

        .signup-footer {
            margin-top: 25px;

            text-align: center;

            font-size: 11px;

            color: #9ca3af;

            letter-spacing: 0.5px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            body {
                padding: 20px 15px;
            }


            .signup-brand-title {
                font-size: 32px;
            }


            .signup-card {
                padding: 25px 20px;
            }


            .signup-heading h1 {
                font-size: 25px;
            }


            .form-grid {
                grid-template-columns: 1fr;
            }


            .form-group.full-width {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


    <div class="signup-page">


        <!-- ==========================================
             BRAND
        =========================================== -->

        <div class="signup-brand">

            <div class="signup-brand-title">
                LOVE LUXE
            </div>

            <div class="signup-brand-subtitle">
                BY EA • EST. 2024
            </div>

        </div>



        <!-- ==========================================
             SIGNUP CARD
        =========================================== -->

        <div class="signup-card">


            <!-- HEADING -->

            <div class="signup-heading">

                <div class="small-title">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create your Love Luxe customer account
                </p>

            </div>



            <!-- ==========================================
                 SIGNUP FORM
            =========================================== -->

            <form
                id="signupForm"
                class="signup-form"
            >


                <div class="form-grid">


                    <!-- FULL NAME -->

                    <div class="form-group full-width">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="signupUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="signupUsername"
                            placeholder="Create a username"
                            autocomplete="username"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group full-width">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                </div>



                <!-- MESSAGE -->

                <div
                    id="signupMessage"
                    class="signup-message"
                ></div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="signup-button"
                >
                    CREATE ACCOUNT
                </button>


            </form>



            <!-- BACK TO LOGIN -->

            <a
                href="index.html"
                class="back-login"
            >
                ← Back to Login
            </a>


        </div>



        <!-- FOOTER -->

        <div class="signup-footer">
            Love Luxe by EA • Est. 2024
        </div>


    </div>



    <!-- ==========================================
         EXISTING AUTHENTICATION SCRIPT
    =========================================== -->

    <script src="data.js"></script>
<script src="script.js"></script>


</body>

</html>
