<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Sign Up</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="brand">

                <h1>
                    LOVE LUXE
                </h1>

                <p>
                    BY EA • EST. 2024
                </p>

            </div>


            <h2>
                Create Account
            </h2>


            <p class="subtitle">
                Create your Love Luxe customer account
            </p>


            <form
                onsubmit="signup(); return false;">


                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>


                <label for="signupUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Create a username"
                    required>


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required>


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>


                <p
                    id="signupMessage"
                    class="message">
                </p>


                <button
                    type="submit"
                    class="main-button">

                    CREATE ACCOUNT

                </button>


            </form>


            <button
                class="secondary-button"
                onclick="window.location.href='index.html'">

                BACK TO LOGIN

            </button>


        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
