<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">

                <h1>LOVE LUXE</h1>

                <p>BY EA • EST. 2024</p>

            </div>


            <h2>Create Account</h2>

            <p class="subtitle">
                Create your Love Luxe customer account
            </p>


            <form onsubmit="signup(); return false;">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Create a username"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <p
                    id="signupMessage"
                    class="message">
                </p>


                <button
                    type="submit"
                    class="main-button">

                    Create Account

                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="index.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
