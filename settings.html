<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Settings
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         MOBILE HEADER
    =========================================== -->

    <header class="mobile-header">

        <button
            class="menu-button"
            type="button"
            onclick="openSidebar()"
        >
            ☰
        </button>

        <div class="mobile-brand">

            LOVE LUXE

            <span>
                by EA
            </span>

        </div>

    </header>


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <a
                href="catalog.html"
                class="sidebar-link"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>


            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span class="account-arrow">
                    ▲
                </span>

            </button>


            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a
                    href="personal.html"
                >
                    Personal Information
                </a>

                <a
                    href="orders.html"
                >
                    My Orders
                </a>

                <a
                    href="settings.html"
                    class="active"
                >
                    Settings
                </a>

            </div>

        </div>

    </aside>


    <!-- ==========================================
         SIDEBAR OVERLAY
    =========================================== -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="customer-main">


        <header class="customer-topbar">

            <div>

                <div class="customer-topbar-label">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Settings
                </h1>

            </div>

        </header>


        <div
            id="accountMessage"
            class="account-message"
        ></div>


        <!-- ==========================================
             SHIPPING ADDRESS
        =========================================== -->

        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        ACCOUNT SETTINGS
                    </div>

                    <h2>
                        Shipping Address
                    </h2>

                    <p>
                        This address will be used when you checkout.
                    </p>

                </div>

            </div>


            <div class="account-card settings-card">

                <div class="account-form-grid">


                    <div class="form-group">

                        <label for="houseNumber">
                            House / Unit Number
                        </label>

                        <input
                            id="houseNumber"
                            type="text"
                            placeholder="e.g. 123"
                        >

                    </div>


                    <div class="form-group">

                        <label for="street">
                            Street
                        </label>

                        <input
                            id="street"
                            type="text"
                            placeholder="Enter street"
                        >

                    </div>


                    <div class="form-group">

                        <label for="barangay">
                            Barangay
                        </label>

                        <input
                            id="barangay"
                            type="text"
                            placeholder="Enter barangay"
                        >

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City / Municipality
                        </label>

                        <input
                            id="city"
                            type="text"
                            placeholder="Enter city or municipality"
                        >

                    </div>


                    <div class="form-group">

                        <label for="province">
                            Province
                        </label>

                        <input
                            id="province"
                            type="text"
                            placeholder="Enter province"
                        >

                    </div>


                    <div class="form-group">

                        <label for="postalCode">
                            Postal Code
                        </label>

                        <input
                            id="postalCode"
                            type="text"
                            placeholder="Enter postal code"
                        >

                    </div>


                </div>


                <div class="settings-card-footer">

                    <button
                        type="button"
                        id="saveShippingButton"
                        class="primary-button"
                    >
                        SAVE SHIPPING ADDRESS
                    </button>

                </div>

            </div>

        </section>


        <!-- ==========================================
             CHANGE PASSWORD
        =========================================== -->

        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        SECURITY
                    </div>

                    <h2>
                        Change Password
                    </h2>

                    <p>
                        Update your account password.
                    </p>

                </div>

            </div>


            <div class="account-card settings-card">

                <div class="password-form">


                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter current password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                        >

                    </div>


                </div>


                <div class="settings-card-footer">

                    <button
                        type="button"
                        id="changePasswordButton"
                        class="primary-button"
                    >
                        CHANGE PASSWORD
                    </button>

                </div>

            </div>

        </section>


    </main>


    <!-- ==========================================
         DATA
    =========================================== -->

    <script src="data.js"></script>


    <script>

        const data = window.LoveLuxeData;

        const user = data.customers[0];


        /* ==========================================
           PAGE LOAD
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadAddress();

                document.getElementById(
                    "saveShippingButton"
                ).onclick = saveAddress;


                document.getElementById(
                    "changePasswordButton"
                ).onclick = changePassword;


                setupSidebar();

            }
        );


        /* ==========================================
           LOAD SHIPPING ADDRESS
        ========================================== */

        function loadAddress() {

            const address =
                user.shippingAddress || {};


            document.getElementById(
                "houseNumber"
            ).value =
                address.houseNumber || "";


            document.getElementById(
                "street"
            ).value =
                address.street || "";


            document.getElementById(
                "barangay"
            ).value =
                address.barangay || "";


            document.getElementById(
                "city"
            ).value =
                address.city || "";


            document.getElementById(
                "province"
            ).value =
                address.province || "";


            document.getElementById(
                "postalCode"
            ).value =
                address.postalCode || "";

        }


        /* ==========================================
           SAVE ADDRESS
        ========================================== */

        function saveAddress() {

            user.shippingAddress = {

                houseNumber:
                    document.getElementById(
                        "houseNumber"
                    ).value.trim(),

                street:
                    document.getElementById(
                        "street"
                    ).value.trim(),

                barangay:
                    document.getElementById(
                        "barangay"
                    ).value.trim(),

                city:
                    document.getElementById(
                        "city"
                    ).value.trim(),

                province:
                    document.getElementById(
                        "province"
                    ).value.trim(),

                postalCode:
                    document.getElementById(
                        "postalCode"
                    ).value.trim()

            };


            showMessage(
                "Shipping address saved successfully for this session.",
                false
            );

        }


        /* ==========================================
           CHANGE PASSWORD
        ========================================== */

        function changePassword() {

            const current =
                document.getElementById(
                    "currentPassword"
                ).value;


            const newPassword =
                document.getElementById(
                    "newPassword"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            if (current !== user.password) {

                showMessage(
                    "Current password is incorrect.",
                    true
                );

                return;

            }


            if (!newPassword) {

                showMessage(
                    "Please enter a new password.",
                    true
                );

                return;

            }


            if (newPassword !== confirmPassword) {

                showMessage(
                    "New passwords do not match.",
                    true
                );

                return;

            }


            user.password = newPassword;


            document.getElementById(
                "currentPassword"
            ).value = "";


            document.getElementById(
                "newPassword"
            ).value = "";


            document.getElementById(
                "confirmPassword"
            ).value = "";


            showMessage(
                "Password changed successfully for this session.",
                false
            );

        }


        /* ==========================================
           MESSAGE
        ========================================== */

        function showMessage(text, error) {

            const box =
                document.getElementById(
                    "accountMessage"
                );


            box.textContent = text;


            box.className =
                error
                    ? "account-message error"
                    : "account-message success";

        }


        /* ==========================================
           SIDEBAR
        ========================================== */

        function setupSidebar() {

            const toggle =
                document.getElementById(
                    "accountToggle"
                );


            const dropdown =
                document.getElementById(
                    "accountDropdown"
                );


            toggle.onclick =
                function () {

                    dropdown.classList.toggle("show");

                    toggle.classList.toggle("active");

                };


            document
                .getElementById("sidebarOverlay")
                .onclick = closeSidebar;

        }


        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");


            document
                .getElementById("sidebarOverlay")
                .classList.add("active");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");


            document
                .getElementById("sidebarOverlay")
                .classList.remove("active");

        }

    </script>


</body>

</html>
