<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Luxe by EA - Settings</title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <style>

        .account-content {
            padding: 30px;
            max-width: 1100px;
        }

        .account-page-header {
            margin-bottom: 25px;
        }

        .account-page-header .small-title {
            color: #c5a059;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .account-page-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .account-page-header p {
            color: #777;
            font-size: 14px;
        }

        .account-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
        }

        .password-form {
            max-width: 650px;
            display: grid;
            gap: 20px;
        }

        .form-group label {
            display: block;
            color: #293b4d;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 47px;
            border: 1px solid #d9dce0;
            border-radius: 7px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        .form-group input:focus {
            border-color: #c5a059;
        }

        .account-card-footer {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #eeeeee;
        }

        .primary-button {
            border: none;
            border-radius: 7px;
            background: #111111;
            color: white;
            min-height: 45px;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #c5a059;
        }

        .account-message {
            display: none;
            padding: 13px 17px;
            border-radius: 7px;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .account-message.success {
            display: block;
            background: #eaf8f0;
            color: #16834a;
            border: 1px solid #c8ebd7;
        }

        .account-message.error {
            display: block;
            background: #fff0ee;
            color: #c0392b;
            border: 1px solid #f0ceca;
        }

        @media (max-width: 700px) {

            .account-content {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <header class="mobile-header">

        <button
            class="menu-button"
            id="menuButton"
            type="button"
        >
            ☰
        </button>

        <div class="mobile-brand">
            LOVE LUXE
            <span>by EA</span>
        </div>

    </header>


    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <a
                href="catalog.html"
                class="sidebar-link"
            >
                <span>Products</span>
            </a>


            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>My Account</span>

                <span
                    class="account-arrow"
                    id="accountArrow"
                >
                    ▲
                </span>

            </button>


            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a href="personal.html">
                    Personal Information
                </a>

                <a href="orders.html">
                    My Orders
                </a>

                <a
                    href="settings.html"
                    class="active"
                >
                    Settings
                </a>

            </div>

        </div>


        <div class="sidebar-bottom">

            <button
                type="button"
                class="sidebar-link logout-link"
                id="logoutButton"
            >
                <span>Logout</span>
            </button>

        </div>

    </aside>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <main class="shop-main">

        <div class="shop-topbar">

            <div>

                <div class="page-small-title">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Settings
                </h1>

            </div>


            <div class="customer-profile">

                <div
                    class="customer-avatar"
                    id="customerAvatar"
                >
                    C
                </div>

                <div>

                    <div class="customer-label">
                        Welcome Customer
                    </div>

                    <div
                        class="customer-name"
                        id="customerName"
                    >
                        Customer
                    </div>

                </div>

            </div>

        </div>


        <section class="account-content">

            <div
                id="accountMessage"
                class="account-message"
            ></div>


            <div class="account-page-header">

                <div class="small-title">
                    ACCOUNT SETTINGS
                </div>

                <h2>
                    Settings
                </h2>

                <p>
                    Manage your account password.
                </p>

            </div>


            <div class="account-card">

                <div class="password-form">

                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter your current password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter your new password"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your new password"
                        >

                    </div>

                </div>


                <div class="account-card-footer">

                    <button
                        type="button"
                        id="changePasswordButton"
                        class="primary-button"
                    >
                        CHANGE PASSWORD
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="data.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const data =
                    window.LoveLuxeData;

                const user =
                    data.customers[0];


                const accountToggle =
                    document.getElementById(
                        "accountToggle"
                    );

                const accountDropdown =
                    document.getElementById(
                        "accountDropdown"
                    );

                const accountArrow =
                    document.getElementById(
                        "accountArrow"
                    );


                accountToggle.addEventListener(
                    "click",
                    function () {

                        const open =
                            accountDropdown.classList.contains(
                                "show"
                            );

                        if (open) {

                            accountDropdown.classList.remove(
                                "show"
                            );

                            accountArrow.textContent =
                                "▼";

                        } else {

                            accountDropdown.classList.add(
                                "show"
                            );

                            accountArrow.textContent =
                                "▲";

                        }

                        accountToggle.classList.add(
                            "active"
                        );

                    }
                );


                const sidebar =
                    document.getElementById(
                        "shopSidebar"
                    );

                const overlay =
                    document.getElementById(
                        "sidebarOverlay"
                    );

                const menuButton =
                    document.getElementById(
                        "menuButton"
                    );


                menuButton.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.add(
                            "open"
                        );

                        overlay.classList.add(
                            "active"
                        );

                    }
                );


                overlay.addEventListener(
                    "click",
                    function () {

                        sidebar.classList.remove(
                            "open"
                        );

                        overlay.classList.remove(
                            "active"
                        );

                    }
                );


                if (user) {

                    document.getElementById(
                        "customerName"
                    ).textContent =
                        user.fullName ||
                        "Customer";

                    document.getElementById(
                        "customerAvatar"
                    ).textContent =
                        (
                            user.fullName ||
                            "C"
                        )
                        .charAt(0)
                        .toUpperCase();

                }


                function showMessage(
                    message,
                    type
                ) {

                    const box =
                        document.getElementById(
                            "accountMessage"
                        );

                    box.textContent =
                        message;

                    box.className =
                        "account-message " +
                        type;

                }


                document.getElementById(
                    "changePasswordButton"
                ).addEventListener(
                    "click",
                    function () {

                        if (!user) {
                            return;
                        }


                        const currentPassword =
                            document.getElementById(
                                "currentPassword"
                            ).value;

                        const newPassword =
                            document.getElementById(
                                "newPassword"
                            ).value;

                        const confirmPassword =
                            document.getElementById(
                                "confirmPassword"
                            ).value;


                        if (
                            currentPassword !==
                            user.password
                        ) {

                            showMessage(
                                "Current password is incorrect.",
                                "error"
                            );

                            return;

                        }


                        if (
                            !newPassword ||
                            !confirmPassword
                        ) {

                            showMessage(
                                "Please complete all password fields.",
                                "error"
                            );

                            return;

                        }


                        if (
                            newPassword !==
                            confirmPassword
                        ) {

                            showMessage(
                                "New passwords do not match.",
                                "error"
                            );

                            return;

                        }


                        user.password =
                            newPassword;


                        document.getElementById(
                            "currentPassword"
                        ).value = "";

                        document.getElementById(
                            "newPassword"
                        ).value = "";

                        document.getElementById(
                            "confirmPassword"
                        ).value = "";


                        showMessage(
                            "Password changed successfully for this session.",
                            "success"
                        );

                    }
                );


                document.getElementById(
                    "logoutButton"
                ).addEventListener(
                    "click",
                    function () {

                        if (
                            confirm(
                                "Are you sure you want to logout?"
                            )
                        ) {

                            data.currentUser =
                                null;

                            window.location.href =
                                "index.html";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
