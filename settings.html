<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Luxe by EA - Settings</title><link rel="stylesheet" href="style.css">
</head>
<body id="customerPage">
<header class="customer-mobile-header"><button type="button" id="customerMenuButton" class="customer-menu-button">☰</button><div class="customer-mobile-brand">LOVE LUXE<span>BY EA • EST. 2024</span></div></header>
<aside id="customerSidebar" class="customer-sidebar"><div class="customer-brand"><div class="customer-brand-title">LOVE LUXE</div><div class="customer-brand-subtitle">BY EA • EST. 2024</div></div><div class="customer-sidebar-welcome"><span>Welcome</span><strong id="sidebarCustomerName">Customer</strong></div><nav class="customer-nav"><div class="customer-nav-heading">ACCOUNT</div><a href="personal.html" class="customer-nav-link">Personal Information</a><a href="orders.html" class="customer-nav-link">My Orders</a><a href="settings.html" class="customer-nav-link active">Settings</a><a href="catalog.html" class="customer-nav-link">Back to Shop</a></nav><div class="customer-sidebar-bottom"><button type="button" id="logoutButton" class="customer-logout-button">↪ &nbsp; Logout</button></div></aside>
<div id="customerSidebarOverlay" class="customer-sidebar-overlay"></div>
<main class="customer-main"><header class="customer-topbar"><div><div class="customer-topbar-label">CUSTOMER ACCOUNT</div><h1>Settings</h1></div></header><div id="accountMessage" class="account-message"></div>
<section class="account-section"><div class="section-heading"><div><div class="section-small-title">ACCOUNT SETTINGS</div><h2>Shipping Address</h2><p>This address will be used when you checkout.</p></div></div><div class="account-card settings-card"><div class="account-form-grid">
<div class="form-group"><label for="houseNumber">House / Unit Number</label><input id="houseNumber" placeholder="e.g. 123"></div><div class="form-group"><label for="street">Street</label><input id="street" placeholder="Enter street"></div><div class="form-group"><label for="barangay">Barangay</label><input id="barangay" placeholder="Enter barangay"></div><div class="form-group"><label for="city">City / Municipality</label><input id="city" placeholder="Enter city or municipality"></div><div class="form-group"><label for="province">Province</label><input id="province" placeholder="Enter province"></div><div class="form-group"><label for="postalCode">Postal Code</label><input id="postalCode" placeholder="Enter postal code"></div>
</div><div class="settings-card-footer"><button type="button" id="saveShippingButton" class="primary-button">SAVE SHIPPING ADDRESS</button></div></div></section>
<section class="account-section"><div class="section-heading"><div><div class="section-small-title">SECURITY</div><h2>Change Password</h2><p>Update your account password.</p></div></div><div class="account-card settings-card"><div class="password-form"><div class="form-group"><label for="currentPassword">Current Password</label><input type="password" id="currentPassword" placeholder="Enter current password"></div><div class="form-group"><label for="newPassword">New Password</label><input type="password" id="newPassword" placeholder="Enter new password"></div><div class="form-group"><label for="confirmPassword">Confirm New Password</label><input type="password" id="confirmPassword" placeholder="Confirm new password"></div></div><div class="settings-card-footer"><button type="button" id="changePasswordButton" class="primary-button">CHANGE PASSWORD</button></div></div></section>
</main>
<script src="data.js"></script><script>
const data=window.LoveLuxeData,user=data.customers[0];
document.addEventListener("DOMContentLoaded",function(){document.getElementById("sidebarCustomerName").textContent=user.fullName;loadAddress();document.getElementById("saveShippingButton").onclick=saveAddress;document.getElementById("changePasswordButton").onclick=changePassword;document.getElementById("logoutButton").onclick=logout;setupMobile();});
function loadAddress(){const a=user.shippingAddress||{};["houseNumber","street","barangay","city","province","postalCode"].forEach(id=>document.getElementById(id).value=a[id]||"")}
function saveAddress(){user.shippingAddress={houseNumber:houseNumber.value.trim(),street:street.value.trim(),barangay:barangay.value.trim(),city:city.value.trim(),province:province.value.trim(),postalCode:postalCode.value.trim()};message("Shipping address saved successfully for this session.",false)}
function changePassword(){const current=currentPassword.value,newPass=newPassword.value,confirmPass=confirmPassword.value;if(current!==user.password){message("Current password is incorrect.",true);return}if(!newPass){message("Please enter a new password.",true);return}if(newPass!==confirmPass){message("New passwords do not match.",true);return}user.password=newPass;currentPassword.value="";newPassword.value="";confirmPassword.value="";message("Password changed successfully for this session.",false)}
function message(text,error){const box=document.getElementById("accountMessage");box.textContent=text;box.className=error?"account-message error":"account-message success"}
function setupMobile(){const b=document.getElementById("customerMenuButton"),s=document.getElementById("customerSidebar"),o=document.getElementById("customerSidebarOverlay");b.onclick=()=>{s.classList.toggle("open");o.classList.toggle("active")};o.onclick=()=>{s.classList.remove("open");o.classList.remove("active")}}
function logout(){if(confirm("Are you sure you want to logout?"))window.location.href="index.html"}
</script></body></html>
