<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Settings
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body id="customerPage">


    <!-- MOBILE HEADER -->

    <header class="customer-mobile-header">

        <button
            type="button"
            id="customerMenuButton"
            class="customer-menu-button"
        >
            ☰
        </button>


        <div class="customer-mobile-brand">

            LOVE LUXE

            <span>
                BY EA • EST. 2024
            </span>

        </div>

    </header>



    <!-- SIDEBAR -->

    <aside
        id="customerSidebar"
        class="customer-sidebar"
    >

        <div class="customer-brand">

            <div class="customer-brand-title">
                LOVE LUXE
            </div>

            <div class="customer-brand-subtitle">
                BY EA • EST. 2024
            </div>

        </div>


        <div class="customer-sidebar-welcome">

            <span>
                Welcome
            </span>

            <strong id="sidebarCustomerName">
                Customer
            </strong>

        </div>


        <nav class="customer-nav">

            <div class="customer-nav-heading">
                ACCOUNT
            </div>


            <a
                href="personal.html"
                class="customer-nav-link"
            >
                Personal Information
            </a>


            <a
                href="orders.html"
                class="customer-nav-link"
            >
                My Orders
            </a>


            <a
                href="settings.html"
                class="customer-nav-link active"
            >
                Settings
            </a>


            <a
                href="catalog.html"
                class="customer-nav-link"
            >
                Back to Shop
            </a>

        </nav>


        <div class="customer-sidebar-bottom">

            <button
                type="button"
                id="logoutButton"
                class="customer-logout-button"
            >
                ↪ &nbsp; Logout
            </button>

        </div>

    </aside>



    <!-- OVERLAY -->

    <div
        id="customerSidebarOverlay"
        class="customer-sidebar-overlay"
    ></div>



    <!-- MAIN -->

    <main class="customer-main">


        <!-- TOP BAR -->

        <header class="customer-topbar">

            <div>

                <div class="customer-topbar-label">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Settings
                </h1>

            </div>

        </header>



        <!-- MESSAGE -->

        <div
            id="accountMessage"
            class="account-message"
        ></div>



        <!-- ======================================
             CHANGE PASSWORD
        ======================================= -->

        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        SECURITY
                    </div>

                    <h2>
                        Change Password
                    </h2>

                    <p>
                        Update your account password.
                    </p>

                </div>

            </div>


            <div class="account-card settings-card">

                <div class="password-form">


                    <!-- CURRENT PASSWORD -->

                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter current password"
                        >

                    </div>



                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                        >

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                        >

                    </div>

                </div>


                <div class="settings-card-footer">

                    <button
                        type="button"
                        id="changePasswordButton"
                        class="primary-button"
                    >
                        CHANGE PASSWORD
                    </button>

                </div>

            </div>

        </section>


    </main>



    <!-- DATA -->

    <script src="data.js"></script>


    <script>

        const data =
            window.LoveLuxeData;

        const user =
            data.customers[0];


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                document.getElementById(
                    "sidebarCustomerName"
                ).textContent =
                    user.fullName;


                document.getElementById(
                    "changePasswordButton"
                ).onclick =
                    changePassword;


                document.getElementById(
                    "logoutButton"
                ).onclick =
                    logout;


                setupMobile();

            }
        );



        /* CHANGE PASSWORD */

        function changePassword() {

            const currentPassword =
                document.getElementById(
                    "currentPassword"
                ).value;


            const newPassword =
                document.getElementById(
                    "newPassword"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            if (
                currentPassword !==
                user.password
            ) {

                showMessage(
                    "Current password is incorrect.",
                    true
                );

                return;

            }


            if (
                newPassword === ""
            ) {

                showMessage(
                    "Please enter a new password.",
                    true
                );

                return;

            }


            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "New passwords do not match.",
                    true
                );

                return;

            }


            user.password =
                newPassword;


            document.getElementById(
                "currentPassword"
            ).value = "";


            document.getElementById(
                "newPassword"
            ).value = "";


            document.getElementById(
                "confirmPassword"
            ).value = "";


            showMessage(
                "Password changed successfully for this session.",
                false
            );

        }



        /* MESSAGE */

        function showMessage(
            text,
            isError
        ) {

            const box =
                document.getElementById(
                    "accountMessage"
                );


            box.textContent =
                text;


            box.className =
                isError
                    ? "account-message error"
                    : "account-message success";

        }



        /* MOBILE SIDEBAR */

        function setupMobile() {

            const button =
                document.getElementById(
                    "customerMenuButton"
                );


            const sidebar =
                document.getElementById(
                    "customerSidebar"
                );


            const overlay =
                document.getElementById(
                    "customerSidebarOverlay"
                );


            button.onclick =
                function () {

                    sidebar.classList.toggle(
                        "open"
                    );

                    overlay.classList.toggle(
                        "active"
                    );

                };


            overlay.onclick =
                function () {

                    sidebar.classList.remove(
                        "open"
                    );

                    overlay.classList.remove(
                        "active"
                    );

                };

        }



        /* LOGOUT */

        function logout() {

            const confirmLogout =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (confirmLogout) {

                window.location.href =
                    "index.html";

            }

        }

    </script>


</body>

</html>
