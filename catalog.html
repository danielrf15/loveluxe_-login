<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Luxe by EA - Products</title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

</head>


<body>


    <!-- MOBILE HEADER -->

    <header class="mobile-header">

        <button
            class="menu-button"
            id="customerMenuButton"
            onclick="openSidebar()"
            type="button"
        >
            ☰
        </button>

        <div class="mobile-brand">
            LOVE LUXE
            <span>by EA</span>
        </div>

    </header>



    <!-- SIDEBAR -->

    <aside
        class="catalog-sidebar"
        id="shopSidebar"
    >

        <div class="catalog-brand">

            <div class="catalog-brand-title">
                Love Luxe
            </div>

            <div class="catalog-brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="customer-welcome">

            <span>
                Welcome Customer
            </span>

            <strong id="customerName">
                Customer
            </strong>

        </div>


        <nav class="catalog-nav">


            <!-- PRODUCTS -->

            <a
                href="catalog.html"
                class="catalog-nav-link active"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>


            <!-- MY ACCOUNT -->

            <a
                href="customer.html"
                class="catalog-nav-link"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

            </a>


            <!-- CATEGORIES -->

            <button
                type="button"
                class="catalog-nav-link"
                onclick="filterCategoryFromSidebar('Bags')"
            >

                <span>
                    👜
                </span>

                <span>
                    Bags
                </span>

            </button>


            <button
                type="button"
                class="catalog-nav-link"
                onclick="filterCategoryFromSidebar('Clothing')"
            >

                <span>
                    👗
                </span>

                <span>
                    Clothing
                </span>

            </button>


            <button
                type="button"
                class="catalog-nav-link"
                onclick="filterCategoryFromSidebar('Perfume')"
            >

                <span>
                    🌸
                </span>

                <span>
                    Perfume
                </span>

            </button>


            <button
                type="button"
                class="catalog-nav-link"
                onclick="filterCategoryFromSidebar('Body Care')"
            >

                <span>
                    🧴
                </span>

                <span>
                    Body Care
                </span>

            </button>


        </nav>


        <!-- NO LOGOUT HERE -->


    </aside>



    <!-- SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- MAIN -->

    <main class="catalog-main">


        <!-- TOPBAR -->

        <div class="catalog-topbar">

            <div>

                <div class="topbar-label">
                    CUSTOMER SHOP
                </div>

                <h1>
                    Product Management
                </h1>

            </div>


            <a
                href="customer.html"
                class="account-button"
            >
                My Account
            </a>

        </div>



        <!-- CONTROLS -->

        <div class="catalog-controls">


            <!-- CATEGORY BUTTONS -->

            <div class="category-buttons">

                <button
                    type="button"
                    class="filter-button active"
                    data-category="All"
                >
                    All
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Bags"
                >
                    Bags
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Clothing"
                >
                    Clothing
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Perfume"
                >
                    Perfume
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Body Care"
                >
                    Body Care
                </button>

            </div>



            <!-- SEARCH -->

            <div class="search-area">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                    autocomplete="off"
                >

            </div>


        </div>



        <!-- PRODUCT COUNT -->

        <div
            class="catalog-info"
            id="productCount"
        >
            Showing 16 product(s)
        </div>



        <!-- PRODUCT GRID -->

        <section
            class="product-grid"
            id="productGrid"
        >
        </section>



        <!-- NO PRODUCTS -->

        <div
            class="no-products"
            id="noProducts"
            style="display: none;"
        >

            <h2>
                No products found
            </h2>

            <p>
                Try another search or category.
            </p>

        </div>



        <!-- FOOTER -->

        <footer
            style="
                margin-top: 50px;
                padding: 25px 0;
                border-top: 1px solid #e0e2e6;
                color: #777777;
                font-size: 13px;
                display: flex;
                justify-content: space-between;
                gap: 20px;
                flex-wrap: wrap;
            "
        >

            <div>
                Love Luxe by EA
            </div>

            <div>
                Products • Bags • Clothing • Perfume • Body Care
            </div>

        </footer>


    </main>



    <!-- CATALOG JAVASCRIPT -->

    <script src="catalog.js"></script>



    <!-- SIDEBAR CATEGORY FUNCTION -->

    <script>

        function filterCategoryFromSidebar(category) {

            const buttons =
                document.querySelectorAll(
                    ".filter-button"
                );


            buttons.forEach(function(button) {

                button.classList.remove("active");

            });


            const selectedButton =
                document.querySelector(
                    '.filter-button[data-category="' +
                    category +
                    '"]'
                );


            if (selectedButton) {

                selectedButton.click();

            }


            closeSidebar();

        }



        /* ======================================
           SIDEBAR
        ====================================== */

        function openSidebar() {

            const sidebar =
                document.getElementById(
                    "shopSidebar"
                );

            const overlay =
                document.getElementById(
                    "sidebarOverlay"
                );


            if (sidebar) {

                sidebar.classList.add("open");

            }


            if (overlay) {

                overlay.classList.add("active");

            }

        }



        function closeSidebar() {

            const sidebar =
                document.getElementById(
                    "shopSidebar"
                );

            const overlay =
                document.getElementById(
                    "sidebarOverlay"
                );


            if (sidebar) {

                sidebar.classList.remove("open");

            }


            if (overlay) {

                overlay.classList.remove("active");

            }

        }



        /* CLOSE SIDEBAR WHEN OVERLAY IS CLICKED */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const overlay =
                    document.getElementById(
                        "sidebarOverlay"
                    );


                if (overlay) {

                    overlay.addEventListener(
                        "click",
                        closeSidebar
                    );

                }

            }
        );

    </script>


</body>

</html>
