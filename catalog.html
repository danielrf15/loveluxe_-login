<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Luxe by EA - Products</title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

</head>


<body>


    <!-- MOBILE HEADER -->

    <header class="mobile-header">

        <button
            class="menu-button"
            id="customerMenuButton"
            onclick="openSidebar()"
            type="button"
        >
            ☰
        </button>

        <div class="mobile-brand">
            LOVE LUXE
            <span>by EA</span>
        </div>

    </header>



    <!-- SIDEBAR -->

    <aside
        class="catalog-sidebar"
        id="shopSidebar"
    >

        <div class="catalog-brand">

            <div class="catalog-brand-title">
                Love Luxe
            </div>

            <div class="catalog-brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="customer-welcome">

            <span>
                Welcome Customer
            </span>

            <strong id="customerName">
                Customer
            </strong>

        </div>


        <nav class="catalog-nav">


            <!-- PRODUCTS -->

            <a
                href="catalog.html"
                class="catalog-nav-link active"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>



            <!-- MY ACCOUNT DROPDOWN -->

            <button
                type="button"
                class="catalog-nav-link account-dropdown-button"
                id="accountDropdownButton"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span
                    class="account-arrow"
                    id="accountArrow"
                >
                    ▾
                </span>

            </button>


            <div
                class="account-dropdown-menu"
                id="accountDropdownMenu"
            >

                <a
                    href="customer.html#personal"
                    class="account-dropdown-link"
                >
                    Personal Information
                </a>


                <a
                    href="customer.html#orders"
                    class="account-dropdown-link"
                >
                    My Orders
                </a>


                <a
                    href="customer.html#settings"
                    class="account-dropdown-link"
                >
                    Settings
                </a>

            </div>


        </nav>

    </aside>



    <!-- SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- MAIN -->

    <main class="catalog-main">


        <!-- TOPBAR -->

        <div class="catalog-topbar">

            <div>

                <div class="topbar-label">
                    CUSTOMER SHOP
                </div>

                <h1>
                    Product Management
                </h1>

            </div>


            <button
                type="button"
                class="account-button"
                id="topAccountButton"
            >
                My Account
            </button>

        </div>



        <!-- CONTROLS -->

        <div class="catalog-controls">


            <!-- CATEGORY BUTTONS -->

            <div class="category-buttons">

                <button
                    type="button"
                    class="filter-button active"
                    data-category="All"
                >
                    All
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Bags"
                >
                    Bags
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Clothing"
                >
                    Clothing
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Perfume"
                >
                    Perfume
                </button>


                <button
                    type="button"
                    class="filter-button"
                    data-category="Body Care"
                >
                    Body Care
                </button>

            </div>



            <!-- SEARCH -->

            <div class="search-area">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                    autocomplete="off"
                >

            </div>


        </div>



        <!-- PRODUCT COUNT -->

        <div
            class="catalog-info"
            id="productCount"
        >
            Showing 16 product(s)
        </div>



        <!-- PRODUCT GRID -->

        <section
            class="product-grid"
            id="productGrid"
        >
        </section>



        <!-- NO PRODUCTS -->

        <div
            class="no-products"
            id="noProducts"
            style="display: none;"
        >

            <h2>
                No products found
            </h2>

            <p>
                Try another search or category.
            </p>

        </div>



        <!-- FOOTER -->

        <footer
            style="
                margin-top: 50px;
                padding: 25px 0;
                border-top: 1px solid #e0e2e6;
                color: #777777;
                font-size: 13px;
                display: flex;
                justify-content: space-between;
                gap: 20px;
                flex-wrap: wrap;
            "
        >

            <div>
                Love Luxe by EA
            </div>

            <div>
                Products • Bags • Clothing • Perfume • Body Care
            </div>

        </footer>


    </main>



    <!-- CATALOG JAVASCRIPT -->

    <script src="catalog.js"></script>


</body>

</html>
