<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Forgot Password</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="brand">

                <h1>
                    LOVE LUXE
                </h1>

                <p>
                    BY EA • EST. 2024
                </p>

            </div>


            <h2>
                Forgot Password
            </h2>


            <p class="subtitle">
                Reset your customer account password.
            </p>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="forgotUsername"
                    placeholder="Enter your username">

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="forgotNewPassword"
                    placeholder="Enter your new password">

            </div>


            <div class="form-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="forgotConfirmPassword"
                    placeholder="Confirm your new password">

            </div>


            <p
                id="forgotMessage"
                class="message">
            </p>


            <button
                class="main-button"
                onclick="resetPassword()">

                RESET PASSWORD

            </button>


            <button
                class="secondary-button"
                onclick="window.location.href='index.html'">

                BACK TO LOGIN

            </button>


        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
