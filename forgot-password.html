<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Luxe by EA - Forgot Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="brand-block">
        <div class="brand-title">LOVE LUXE</div>
        <div class="brand-subtitle">BY EA • EST. 2024</div>
    </div>
    <h1>Forgot Password</h1>
    <p class="auth-welcome">Reset your customer account password</p>
    <form id="forgotForm">
        <label for="forgotUsername">Username</label>
        <input id="forgotUsername" type="text" placeholder="Enter your username" required>
        <label for="newForgotPassword">New Password</label>
        <input id="newForgotPassword" type="password" placeholder="Enter your new password" required>
        <label for="confirmForgotPassword">Confirm New Password</label>
        <input id="confirmForgotPassword" type="password" placeholder="Confirm your new password" required>
        <button type="submit" class="primary-button">RESET PASSWORD</button>
    </form>
    <div id="forgotMessage" class="form-message"></div>
    <p class="bottom-link"><a href="index.html">Back to Sign In</a></p>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
