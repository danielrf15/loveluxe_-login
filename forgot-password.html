<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Forgot Password</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="brand">

                <h1>
                    LOVE LUXE
                </h1>

                <p>
                    BY EA • EST. 2024
                </p>

            </div>


            <h2>
                Forgot Password
            </h2>


            <p class="subtitle">
                Reset your customer account password
            </p>


            <form
                onsubmit="resetPassword(); return false;">


                <label for="forgotUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="forgotUsername"
                    placeholder="Enter your username"
                    required>


                <label for="forgotNewPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="forgotNewPassword"
                    placeholder="Enter your new password"
                    required>


                <label for="forgotConfirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="forgotConfirmPassword"
                    placeholder="Confirm your new password"
                    required>


                <p
                    id="forgotMessage"
                    class="message">
                </p>


                <button
                    type="submit"
                    class="main-button">

                    RESET PASSWORD

                </button>


            </form>


            <button
                class="secondary-button"
                onclick="window.location.href='index.html'">

                BACK TO LOGIN

            </button>


        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
