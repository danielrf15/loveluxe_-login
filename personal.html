<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Personal Information
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <style>

        /* ==========================================
           ACCOUNT PAGE
        ========================================== */

        .account-page-content {
            padding: 35px 40px 50px;
        }


        .account-page-header {
            margin-bottom: 28px;
        }


        .account-page-eyebrow {
            color: #c5a059;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }


        .account-page-header h2 {
            font-family: Georgia, serif;
            font-size: 30px;
            margin-bottom: 8px;
        }


        .account-page-header p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }


        .account-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 25px;
        }


        .account-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #333;
        }


        .form-group input {
            width: 100%;
            height: 45px;
            border: 1px solid #d9dde5;
            border-radius: 7px;
            padding: 0 13px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }


        .form-group input:focus {
            border-color: #c5a059;
        }


        .readonly-input {
            background: #f5f6fa;
            color: #777;
        }


        .account-card-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }


        .primary-button {
            border: none;
            background: #111111;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .5px;
            cursor: pointer;
        }


        .primary-button:hover {
            background: #c5a059;
        }


        .account-message {
            display: none;
            padding: 13px 16px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
        }


        .account-message.show {
            display: block;
        }


        .account-message.success {
            background: #edf8ef;
            color: #27733b;
        }


        .account-message.error {
            background: #fff0f0;
            color: #a72e2e;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .account-page-content {
                padding: 25px 18px 40px;
            }


            .account-form-grid {
                grid-template-columns: 1fr;
            }


            .account-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         MOBILE HEADER
    =========================================== -->

    <header class="mobile-header">

        <button
            class="menu-button"
            onclick="openSidebar()"
            type="button"
        >
            ☰
        </button>


        <div class="mobile-brand">

            LOVE LUXE

            <span>
                by EA
            </span>

        </div>

    </header>



    <!-- ==========================================
         SAME SIDEBAR AS CATALOG
    =========================================== -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>



        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <!-- PRODUCTS -->

            <a
                href="catalog.html"
                class="sidebar-link"
                id="productsLink"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>



            <!-- MY ACCOUNT -->

            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span class="account-arrow">
                    ▲
                </span>

            </button>



            <!-- ACCOUNT DROPDOWN -->

            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a
                    href="personal.html"
                    class="active"
                >
                    Personal Information
                </a>

                <a href="orders.html">
                    My Orders
                </a>

                <a href="settings.html">
                    Settings
                </a>

            </div>

        </div>

    </aside>



    <!-- SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="shop-main">


        <!-- TOP BAR -->

        <div class="shop-topbar">

            <div>

                <div class="page-small-title">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Personal Information
                </h1>

            </div>


            <div class="customer-profile">

                <div class="customer-avatar">
                    C
                </div>

                <div>

                    <div class="customer-label">
                        Welcome Customer
                    </div>

                    <div
                        class="customer-name"
                        id="customerName"
                    >
                        Customer
                    </div>

                </div>

            </div>

        </div>



        <!-- ACCOUNT CONTENT -->

        <section class="account-page-content">


            <div class="account-page-header">

                <div class="account-page-eyebrow">
                    ACCOUNT
                </div>

                <h2>
                    Personal Information
                </h2>

                <p>
                    Manage your basic account information.
                </p>

            </div>



            <div
                id="accountMessage"
                class="account-message"
            ></div>



            <div class="account-card">

                <div class="account-form-grid">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="accountFullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="accountFullName"
                            placeholder="Enter your full name"
                        >

                    </div>



                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="accountUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="accountUsername"
                            placeholder="Enter your username"
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="accountPhone">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="accountPhone"
                            placeholder="Enter your phone number"
                        >

                    </div>



                    <!-- ACCOUNT TYPE -->

                    <div class="form-group">

                        <label>
                            Account Type
                        </label>

                        <input
                            type="text"
                            value="Customer"
                            readonly
                            class="readonly-input"
                        >

                    </div>

                </div>



                <div class="account-card-footer">

                    <button
                        type="button"
                        id="saveAccountButton"
                        class="primary-button"
                    >
                        SAVE CHANGES
                    </button>

                </div>

            </div>

        </section>

    </main>



    <!-- ==========================================
         DATA
    =========================================== -->

    <script src="data.js"></script>


    <script>

        /* ==========================================
           ACCOUNT DROPDOWN
        ========================================== */

        const accountToggle =
            document.getElementById("accountToggle");

        const accountDropdown =
            document.getElementById("accountDropdown");


        accountToggle.addEventListener(
            "click",
            function () {

                accountDropdown.classList.toggle("show");

                accountToggle.classList.toggle("active");

                if (
                    accountDropdown.classList.contains("show")
                ) {

                    accountToggle.querySelector(
                        ".account-arrow"
                    ).textContent = "▲";

                } else {

                    accountToggle.querySelector(
                        ".account-arrow"
                    ).textContent = "▼";

                }

            }
        );



        /* ==========================================
           MOBILE SIDEBAR
        ========================================== */

        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");

            document
                .getElementById("sidebarOverlay")
                .classList.add("active");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");

            document
                .getElementById("sidebarOverlay")
                .classList.remove("active");

        }


        document
            .getElementById("sidebarOverlay")
            .addEventListener(
                "click",
                closeSidebar
            );



        /* ==========================================
           CUSTOMER DATA
        ========================================== */

        const customer =
            customers.find(
                function (user) {

                    return user.role === "customer";

                }
            );


        if (!customer) {

            window.location.href = "index.html";

        } else {

            document.getElementById(
                "customerName"
            ).textContent =
                customer.fullName || "Customer";


            document.getElementById(
                "accountFullName"
            ).value =
                customer.fullName || "";


            document.getElementById(
                "accountUsername"
            ).value =
                customer.username || "";


            document.getElementById(
                "accountPhone"
            ).value =
                customer.phone || "";

        }



        /* ==========================================
           SAVE INFORMATION
        ========================================== */

        document
            .getElementById("saveAccountButton")
            .addEventListener(
                "click",
                function () {

                    const fullName =
                        document
                            .getElementById("accountFullName")
                            .value
                            .trim();

                    const username =
                        document
                            .getElementById("accountUsername")
                            .value
                            .trim();

                    const phone =
                        document
                            .getElementById("accountPhone")
                            .value
                            .trim();


                    const message =
                        document.getElementById(
                            "accountMessage"
                        );


                    if (!fullName || !username) {

                        message.textContent =
                            "Please complete your name and username.";

                        message.className =
                            "account-message error show";

                        return;

                    }


                    customer.fullName =
                        fullName;

                    customer.username =
                        username;

                    customer.phone =
                        phone;


                    document.getElementById(
                        "customerName"
                    ).textContent =
                        fullName;


                    message.textContent =
                        "Personal information updated.";

                    message.className =
                        "account-message success show";

                }
            );

    </script>


</body>

</html>
