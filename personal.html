<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Love Luxe by EA - Personal Information
    </title>

    <link
        rel="stylesheet"
        href="catalog.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         MOBILE HEADER
    =========================================== -->

    <header class="mobile-header">

        <button
            class="menu-button"
            type="button"
            onclick="openSidebar()"
        >
            ☰
        </button>

        <div class="mobile-brand">

            LOVE LUXE

            <span>
                by EA
            </span>

        </div>

    </header>


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <aside
        class="shop-sidebar"
        id="shopSidebar"
    >

        <div class="sidebar-brand">

            <div class="brand-title">
                Love Luxe
            </div>

            <div class="brand-subtitle">
                by EA • Est. 2024
            </div>

        </div>


        <div class="sidebar-section">

            <div class="sidebar-label">
                SHOP
            </div>


            <a
                href="catalog.html"
                class="sidebar-link"
            >

                <span>
                    🛍️
                </span>

                <span>
                    Products
                </span>

            </a>


            <button
                type="button"
                class="sidebar-link account-toggle active"
                id="accountToggle"
            >

                <span>
                    👤
                </span>

                <span>
                    My Account
                </span>

                <span class="account-arrow">
                    ▲
                </span>

            </button>


            <div
                class="account-dropdown show"
                id="accountDropdown"
            >

                <a
                    href="personal.html"
                    class="active"
                >
                    Personal Information
                </a>

                <a
                    href="orders.html"
                >
                    My Orders
                </a>

                <a
                    href="settings.html"
                >
                    Settings
                </a>

            </div>

        </div>

    </aside>


    <!-- ==========================================
         SIDEBAR OVERLAY
    =========================================== -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="customer-main">


        <!-- TOP BAR -->

        <header class="customer-topbar">

            <div>

                <div class="customer-topbar-label">
                    CUSTOMER ACCOUNT
                </div>

                <h1>
                    Personal Information
                </h1>

            </div>

        </header>


        <!-- MESSAGE -->

        <div
            id="accountMessage"
            class="account-message"
        ></div>


        <!-- PERSONAL INFORMATION -->

        <section class="account-section">

            <div class="section-heading">

                <div>

                    <div class="section-small-title">
                        ACCOUNT
                    </div>

                    <h2>
                        Personal Information
                    </h2>

                    <p>
                        Manage your basic account information.
                    </p>

                </div>

            </div>


            <div class="account-card">

                <div class="account-form-grid">


                    <div class="form-group">

                        <label for="accountFullName">
                            Full Name
                        </label>

                        <input
                            id="accountFullName"
                            type="text"
                            placeholder="Enter your full name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="accountUsername">
                            Username
                        </label>

                        <input
                            id="accountUsername"
                            type="text"
                            placeholder="Enter your username"
                        >

                    </div>


                    <div class="form-group">

                        <label for="accountPhone">
                            Phone Number
                        </label>

                        <input
                            id="accountPhone"
                            type="text"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Account Type
                        </label>

                        <input
                            type="text"
                            value="Customer"
                            readonly
                            class="readonly-input"
                        >

                    </div>

                </div>


                <div class="account-card-footer">

                    <button
                        type="button"
                        id="saveAccountButton"
                        class="primary-button"
                    >
                        SAVE CHANGES
                    </button>

                </div>

            </div>

        </section>


        <!-- ACCOUNT SUMMARY -->

        <section class="account-summary-section">

            <div class="summary-card">

                <div class="summary-title">
                    ACCOUNT SUMMARY
                </div>

                <div class="summary-grid">

                    <div>

                        <span>
                            Account Type
                        </span>

                        <strong>
                            Customer
                        </strong>

                    </div>


                    <div>

                        <span>
                            Username
                        </span>

                        <strong id="summaryUsername">
                            —
                        </strong>

                    </div>


                    <div>

                        <span>
                            Orders
                        </span>

                        <strong id="summaryOrders">
                            0
                        </strong>

                    </div>

                </div>

            </div>

        </section>


    </main>


    <!-- ==========================================
         DATA
    =========================================== -->

    <script src="data.js"></script>


    <script>

        const data = window.LoveLuxeData;

        const user = data.customers[0];


        /* ==========================================
           PAGE LOAD
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                document.getElementById(
                    "accountFullName"
                ).value = user.fullName;


                document.getElementById(
                    "accountUsername"
                ).value = user.username;


                document.getElementById(
                    "accountPhone"
                ).value = user.phone || "";


                document.getElementById(
                    "summaryUsername"
                ).textContent = user.username;


                document.getElementById(
                    "summaryOrders"
                ).textContent =
                    data.orders.filter(
                        function (order) {

                            return (
                                order.customerUsername ===
                                user.username
                            );

                        }
                    ).length;


                document.getElementById(
                    "saveAccountButton"
                ).onclick = saveAccount;


                setupSidebar();

            }
        );


        /* ==========================================
           SAVE ACCOUNT
        ========================================== */

        function saveAccount() {

            const name =
                document.getElementById(
                    "accountFullName"
                ).value.trim();


            const username =
                document.getElementById(
                    "accountUsername"
                ).value.trim();


            const phone =
                document.getElementById(
                    "accountPhone"
                ).value.trim();


            if (!name || !username) {

                showMessage(
                    "Please enter your name and username.",
                    true
                );

                return;

            }


            user.fullName = name;

            user.username = username;

            user.phone = phone;


            document.getElementById(
                "summaryUsername"
            ).textContent = username;


            showMessage(
                "Personal information saved successfully for this session.",
                false
            );

        }


        /* ==========================================
           MESSAGE
        ========================================== */

        function showMessage(text, error) {

            const box =
                document.getElementById(
                    "accountMessage"
                );


            box.textContent = text;


            box.className =
                error
                    ? "account-message error"
                    : "account-message success";

        }


        /* ==========================================
           SIDEBAR
        ========================================== */

        function setupSidebar() {

            const toggle =
                document.getElementById(
                    "accountToggle"
                );


            const dropdown =
                document.getElementById(
                    "accountDropdown"
                );


            toggle.onclick =
                function () {

                    dropdown.classList.toggle("show");

                    toggle.classList.toggle("active");

                };


            document
                .getElementById("sidebarOverlay")
                .onclick = closeSidebar;

        }


        function openSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.add("open");


            document
                .getElementById("sidebarOverlay")
                .classList.add("active");

        }


        function closeSidebar() {

            document
                .getElementById("shopSidebar")
                .classList.remove("open");


            document
                .getElementById("sidebarOverlay")
                .classList.remove("active");

        }

    </script>


</body>

</html>
