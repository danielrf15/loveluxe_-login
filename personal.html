<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Luxe by EA - Personal Information</title>
<link rel="stylesheet" href="style.css">
</head>
<body id="customerPage">
<header class="customer-mobile-header"><button type="button" id="customerMenuButton" class="customer-menu-button">☰</button><div class="customer-mobile-brand">LOVE LUXE<span>BY EA • EST. 2024</span></div></header>
<aside id="customerSidebar" class="customer-sidebar">
<div class="customer-brand"><div class="customer-brand-title">LOVE LUXE</div><div class="customer-brand-subtitle">BY EA • EST. 2024</div></div>
<div class="customer-sidebar-welcome"><span>Welcome</span><strong id="sidebarCustomerName">Customer</strong></div>
<nav class="customer-nav"><div class="customer-nav-heading">ACCOUNT</div>
<a href="personal.html" class="customer-nav-link active">Personal Information</a>
<a href="orders.html" class="customer-nav-link">My Orders</a>
<a href="settings.html" class="customer-nav-link">Settings</a>
<a href="catalog.html" class="customer-nav-link">Back to Shop</a>
</nav>
<div class="customer-sidebar-bottom"><button type="button" id="logoutButton" class="customer-logout-button">↪ &nbsp; Logout</button></div>
</aside>
<div id="customerSidebarOverlay" class="customer-sidebar-overlay"></div>
<main class="customer-main">
<header class="customer-topbar"><div><div class="customer-topbar-label">CUSTOMER ACCOUNT</div><h1>Personal Information</h1></div></header>
<div id="accountMessage" class="account-message"></div>
<section class="account-section"><div class="section-heading"><div><div class="section-small-title">ACCOUNT</div><h2>Personal Information</h2><p>Manage your basic account information.</p></div></div>
<div class="account-card"><div class="account-form-grid">
<div class="form-group"><label for="accountFullName">Full Name</label><input id="accountFullName" type="text" placeholder="Enter your full name"></div>
<div class="form-group"><label for="accountUsername">Username</label><input id="accountUsername" type="text" placeholder="Enter your username"></div>
<div class="form-group"><label for="accountPhone">Phone Number</label><input id="accountPhone" type="text" placeholder="Enter your phone number"></div>
<div class="form-group"><label>Account Type</label><input type="text" value="Customer" readonly class="readonly-input"></div>
</div><div class="account-card-footer"><button type="button" id="saveAccountButton" class="primary-button">SAVE CHANGES</button></div></div></section>
<section class="account-summary-section"><div class="summary-card"><div class="summary-title">ACCOUNT SUMMARY</div><div class="summary-grid"><div><span>Account Type</span><strong>Customer</strong></div><div><span>Username</span><strong id="summaryUsername">—</strong></div><div><span>Orders</span><strong id="summaryOrders">0</strong></div></div></div></section>
</main>
<script src="data.js"></script>
<script>
const data=window.LoveLuxeData;const user=data.customers[0];
document.addEventListener("DOMContentLoaded",function(){
 document.getElementById("sidebarCustomerName").textContent=user.fullName;
 document.getElementById("accountFullName").value=user.fullName;
 document.getElementById("accountUsername").value=user.username;
 document.getElementById("accountPhone").value=user.phone||"";
 document.getElementById("summaryUsername").textContent=user.username;
 document.getElementById("summaryOrders").textContent=data.orders.filter(o=>o.customerUsername===user.username).length;
 document.getElementById("saveAccountButton").onclick=saveAccount;
 document.getElementById("logoutButton").onclick=logout;
 setupMobile();
});
function saveAccount(){const name=document.getElementById("accountFullName").value.trim();const username=document.getElementById("accountUsername").value.trim();if(!name||!username){message("Please enter your name and username.",true);return;}user.fullName=name;user.username=username;user.phone=document.getElementById("accountPhone").value.trim();document.getElementById("sidebarCustomerName").textContent=name;document.getElementById("summaryUsername").textContent=username;message("Personal information saved successfully for this session.",false);}
function message(text,error){const box=document.getElementById("accountMessage");box.textContent=text;box.className=error?"account-message error":"account-message success";}
function setupMobile(){const b=document.getElementById("customerMenuButton"),s=document.getElementById("customerSidebar"),o=document.getElementById("customerSidebarOverlay");b.onclick=()=>{s.classList.toggle("open");o.classList.toggle("active")};o.onclick=()=>{s.classList.remove("open");o.classList.remove("active")}}
function logout(){if(confirm("Are you sure you want to logout?"))window.location.href="index.html"}
</script>
</body></html>
